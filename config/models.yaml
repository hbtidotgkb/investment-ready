# LLM gateway configuration. Switching a role's model is a config change only.
# Spec §12 "LLM gateway". Every call logs role, prompt version, model, tokens, cost, latency.
version: models@1
provider: anthropic

# The spec assigns Quant=Claude, News=Gemini, Forensic=ChatGPT and requires Head–Critic
# vendor separation. This build is configured Anthropic-only (user decision, 15 Nov 2026),
# so vendor diversity is DEGRADED. Every decision record carries this flag.
vendor_separation: degraded

# USD per million tokens. Verify against https://www.anthropic.com/pricing before relying on cost caps.
pricing_usd_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
  # Web search server tool: billed per search on top of tokens
  web_search_per_1k: 10.00

roles:
  discovery:   {model: claude-opus-5-5, effort: low,    max_tokens: 16000, prompt: discovery@2.0.0}
  quant:       {model: claude-opus-5-5, effort: high,   max_tokens: 16000, prompt: quant@2.0.0}
  news:        {model: claude-opus-5-5, effort: high,   max_tokens: 16000, prompt: news@2.0.0}
  forensic:    {model: claude-opus-5-5, effort: high,   max_tokens: 16000, prompt: forensic@2.0.0}
  head:        {model: claude-opus-5-5, effort: high,   max_tokens: 16000, prompt: head@2.0.0}
  critic:      {model: claude-opus-5-5, effort: high,   max_tokens: 16000, prompt: critic@2.0.0}
  research_qa: {model: claude-opus-5-5, effort: low,    max_tokens: 8000,  prompt: research_qa@2.0.0}
  claims:      {model: claude-opus-5-5, effort: low,    max_tokens: 8000,  prompt: claims@2.0.0}

# Bounded validation repairs per spec §11 "Validation and retries"
max_validation_repairs: 2
