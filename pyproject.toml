[project]
name = "ca-platform"
version = "0.7.0"
description = "Personal CA Platform — multi-brain, evidence-cited Indian equity research (personal use; analysis, not investment advice)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "openai>=2.0",
  "mcp>=2.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "duckdb>=1.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "feedparser>=6.0",
  "kiteconnect>=5.0",
  "keyring>=25.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ca = "ca_platform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ca_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
