# Personal configuration. Spec §15 step 7: configure explicit horizons, risk base,
# planned-loss limits and cash policy BEFORE any actionable allocation.
# Until `policies_confirmed: true`, every output is research-only (no actionable buy).
version: user@1
policies_confirmed: false

capital:
  total_investment_capital_inr: null     # e.g. 1000000 — required for position sizing
  available_cash_inr: null
  core_pct: 50                           # strategic core (index ETF) vs satellite (stocks)
  portfolio_planned_loss_budget_pct: null  # spec: must be set before production allocation; no default invented

budget:
  monthly_llm_budget_usd: 25.0           # hard cap enforced in code (spec N6)
  per_run_reservation_usd: 1.50          # reserved before a panel starts; reconciled after

analysis:
  default_loops: 1                       # loops per run (UI lets you pick 1..max_loops)
  max_loops: 3                           # each loop re-fetches all evidence; cost scales with loops
  max_view_chars: 400000                 # evidence text one brain may read (~100k tokens); more ET captures fit

display:
  top_sources: 8                         # "best sources" shown on the verdict (5..10)

inbox:
  auto_extract_claims: true              # extract attributed claims after an attested capture arrives
  queue_max_pending: 100                 # ET article queue (raised from the spec's 20-page default at user request)
  scan_max_links: 15                     # article links taken from one ET topic/listing page scan

ideas:
  max_idea_articles: 20                  # stock-idea article list (you asked for ~10)
  default_top: 8                         # best ideas shown (5..10)
  batch_concurrency: 1                   # panel analyses run at once in a batch (raise carefully: cost/rate limits)

service:
  host: 127.0.0.1                        # loopback only (spec N14)
  port: 8765
